<svg xmlns="http://www.w3.org/2000/svg" width="390" height="40" viewBox="0 0 390 40" role="img" aria-label="Open to work - Full Stack / Backend roles" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pulse {
      transform-origin: 24px 20px;
      animation: pulse 1.8s ease-out infinite;
    }
